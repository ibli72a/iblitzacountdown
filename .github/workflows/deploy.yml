name: Deploy

on:
  push:
    branches: [main]
  # The OG card and caption are baked at build time. The day count flips at 04:00 UTC
  # (06:00 CEST, the departure time), so the rebuild must land AFTER that — GitHub runs
  # cron late (up to ~1h), and a build seconds before the flip bakes a count that is
  # wrong for the whole following day. The extra runs re-bake the same number as
  # insurance: GitHub silently skips scheduled runs sometimes.
  schedule:
    - cron: '15 4,10,16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
